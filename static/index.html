<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>study assistant</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<!-- syntax highlighting for code files in the viewer -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">

  <div class="main">
    <div class="main-inner">
      <h1><a href="#" title="all subjects">study assistant</a></h1>

      <!-- The first page: the subjects of a semester with their exam dates -->
      <div id="home" hidden>
        <div class="toolbar home-head">
          <select id="semester" class="big-picker" aria-label="semester"></select>
          <span class="menu-wrap">
            <button class="icon-btn menu-btn" title="semester options" aria-label="semester options"
                    onclick="toggleMenu(event, 'semester-menu')">⋯</button>
            <div class="menu" id="semester-menu" hidden>
              <button onclick="renameSemester()">rename</button>
              <button class="menu-danger" onclick="openDeleteSemester()">delete semester</button>
            </div>
          </span>
          <span class="spacer"></span>
          <button class="ghost" onclick="addSemester()">+ semester</button>
          <button class="ghost" id="add-subject" onclick="addSubject()">+ subject</button>
        </div>
        <div id="subject-cards"></div>
      </div>

      <div id="subject-page" hidden>
      <div class="toolbar">
        <a class="back-link" href="#" title="all subjects">← subjects</a>
        <select id="subject" class="big-picker" aria-label="subject"></select>
        <span class="menu-wrap">
          <button class="icon-btn menu-btn" title="subject options" aria-label="subject options"
                  onclick="toggleMenu(event, 'subject-menu')">⋯</button>
          <div class="menu" id="subject-menu" hidden>
            <button onclick="renameSubject()">rename</button>
            <button onclick="moveSubject()">move to semester…</button>
            <button class="menu-danger" onclick="openDeleteSubject()">delete subject</button>
          </div>
        </span>
        <span class="spacer"></span>
        <button class="ghost" onclick="addBlock()">+ block</button>
      </div>
      <div class="exam" id="exam"></div>

      <div class="tabs" role="tablist">
        <button class="tab" id="tab-blocks" role="tab" onclick="setView('blocks')">Blocks</button>
        <button class="tab" id="tab-focus" role="tab" onclick="setView('focus')">Focus</button>
        <button class="tab" id="tab-exams" role="tab" onclick="setView('exams')">Exams</button>
        <button class="tab" id="tab-homework" role="tab" onclick="setView('homework')">Homework</button>
        <button class="ghost tabs-collapse" title="close every open topic" onclick="collapseAll()">collapse all</button>
      </div>

      <div id="blocks"></div>
      <div id="focus" hidden></div>
      <div id="exams" hidden></div>
      <div id="homework" hidden></div>
      </div>
    </div>
  </div>

  <!-- The app's own message, confirm and name dialog, in place of the browser's alert/confirm/prompt -->
  <dialog class="confirm-dialog" id="app-dialog">
    <h2 id="ad-title"></h2>
    <p class="ad-text" id="ad-text"></p>
    <input id="ad-input" autocomplete="off">
    <select id="ad-select"></select>
    <div class="dialog-actions">
      <button class="ghost" id="ad-cancel">cancel</button>
      <button class="primary" id="ad-ok">ok</button>
    </div>
  </dialog>

  <!-- Deleting a subject or a whole semester: the name has to be typed first -->
  <dialog class="confirm-dialog" id="delete-subject">
    <h2>Delete <span class="ds-kind"></span> “<span id="ds-name"></span>”?</h2>
    <p>Everything inside will be deleted:</p>
    <p class="ds-counts" id="ds-counts"></p>
    <label class="ds-label" for="ds-input">To confirm, type the <span class="ds-kind"></span> name:</label>
    <input id="ds-input" autocomplete="off">
    <div class="dialog-actions">
      <button class="ghost" onclick="document.getElementById('delete-subject').close()">cancel</button>
      <button class="danger-btn" id="ds-confirm" disabled>delete</button>
    </div>
  </dialog>

  <!-- Appears next to text selected in a summary or note -->
  <!-- Two kinds of mark: "don't get it" (a weak spot) or a note on the margin -->
  <div class="mark-popover" id="mark-popover" data-mode="unclear" hidden>
    <div class="mark-modes">
      <button class="mark-mode mark-mode-unclear" onclick="setMarkMode('unclear')">? I don't get this</button>
      <button class="mark-mode mark-mode-note" onclick="setMarkMode('note')">✎ note</button>
    </div>
    <textarea id="mark-comment" rows="2" placeholder="what exactly? (optional)"
              onkeydown="if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); saveMark(); }"></textarea>
    <label class="mark-revisit"><input type="checkbox" id="mark-revisit"> still shaky</label>
    <div class="edit-actions">
      <button class="primary" id="mark-save" onclick="saveMark()">mark</button>
      <button class="ghost" onclick="hideMarkPopover()">cancel</button>
    </div>
  </div>

  <!-- Shows a margin note while the mouse is over the text it sits on -->
  <div class="note-tip" id="note-tip" hidden></div>

  <div class="divider" id="divider"></div>

  <div class="viewer" id="viewer">
    <div class="viewer-bar">
      <span id="viewer-name"></span>
      <button class="icon-btn" onclick="closeViewer()" title="close" aria-label="close">
        <svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <iframe id="pdf-frame"></iframe>
    <!-- a code or Markdown file is shown here instead of the PDF frame -->
    <div class="text-view" id="text-view" hidden></div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
